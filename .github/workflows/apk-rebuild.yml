name: Current staging APK
on:
  push:
    branches: [codex/task-apk-current]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMBOLS_NATIVE_API: https://symbols-api-staging.votarumshee.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm test && npm run build && npm run check:release && npx cap sync android
        working-directory: WebClient
      - run: chmod +x gradlew && ./gradlew :app:assembleStagingUnsignedQa :app:lintStagingUnsignedQa
        working-directory: WebClient/android
      - name: Verify package and prepare unsigned artifact
        run: |
          mkdir -p bundle
          apk=$(find WebClient/android/app/build/outputs/apk/staging/unsignedQa -name '*.apk')
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > bundle/package.txt
          grep -q "package: name='com.votarumshee.symbols.qa' versionCode='4' versionName='1.1.2'" bundle/package.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          cp "$apk" bundle/symbols-staging-1.1.2-unsigned.apk
          cp WebClient/www/build.json bundle/build.json
          git rev-parse HEAD > bundle/source-sha.txt
          printf '%s\n' 'UNSIGNED: original QA key required before installation. Do not uninstall the existing app.' > bundle/README.txt
          (cd bundle && sha256sum *.apk build.json source-sha.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-staging-1.1.2-unsigned-signing-required
          path: bundle/
          retention-days: 7
