name: Shared Web Client
on:
  push:
    paths: ['WebClient/**', 'Server/**', 'contracts/**', '.github/workflows/web-client.yml']
  pull_request:
    paths: ['WebClient/**', 'Server/**', 'contracts/**', '.github/workflows/web-client.yml']
concurrency:
  group: web-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env: {POSTGRES_PASSWORD: ci-only, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
      SYMBOLS_NATIVE_API: https://symbols-api.votarumshee.com
      SYMBOLS_RELEASE_CHECK: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: WebClient/package-lock.json}
      - run: npm ci --ignore-scripts
        working-directory: Server
      - run: npm ci
        working-directory: WebClient
      - run: npx playwright install --with-deps chromium
        working-directory: WebClient
      - run: npm test && npm run build
        working-directory: Server
      - run: npm test && npm run build && npm run check:release && npm audit && npm run test:e2e
        working-directory: WebClient
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-web-evidence
          path: |
            WebClient/artifacts/
            WebClient/www/
  android:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env: {POSTGRES_PASSWORD: ci-only, POSTGRES_DB: symbols_android_ci}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/symbols_android_ci
      PORT: 8080
      SYMBOLS_NATIVE_API: http://10.0.2.2:8080
      SYMBOLS_QA_KEYSTORE: ${{ github.workspace }}/ci-qa.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: keytool -genkeypair -keystore "$SYMBOLS_QA_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Disposable CI QA' -keyalg RSA -validity 30
      - run: npm ci --ignore-scripts && npm run db:migrate && npm run db:seed
        working-directory: Server
      - run: |
          node Server/src/main.mjs > /tmp/symbols-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci && npm run build && npx cap sync android
        working-directory: WebClient
      - run: chmod +x gradlew && ./gradlew :app:assembleLocalQa :app:assembleLocalQaAndroidTest
        working-directory: WebClient/android
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install WebClient/android/app/build/outputs/apk/local/qa/app-local-qa.apk
            adb install WebClient/android/app/build/outputs/apk/androidTest/local/qa/app-local-qa-androidTest.apk
            adb shell am instrument -w -e mode smoke com.votarumshee.symbols.dev.qa.test/com.votarumshee.symbols.webpreview.MigrationAcceptanceTest | tee /tmp/native-smoke.txt
            grep -q 'NATIVE_SMOKE_PASS' /tmp/native-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-disposable-ci-qa-not-upgrade-compatible
          path: |
            WebClient/android/app/build/outputs/apk/
            /tmp/native-smoke.txt
  ios:
    runs-on: macos-latest
    env:
      SYMBOLS_NATIVE_API: https://symbols-api.votarumshee.com
      SYMBOLS_RELEASE_CHECK: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci && npm run build && npm run check:release && npx cap sync ios
        working-directory: WebClient
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: WebClient
