name: symbols-staging
x-logging: &logging
  driver: local
  options: {max-size: 5m, max-file: '2'}
services:
  db:
    image: ${POSTGRES_IMAGE:?Required}
    environment:
      POSTGRES_DB: symbols
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Required}
      APP_PASSWORD: ${APP_PASSWORD:?Required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d symbols]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    shm_size: 128m
    logging: *logging
  migrate:
    image: ${SYMBOLS_IMAGE:?Required}
    pull_policy: never
    profiles: [tools]
    environment:
      DATABASE_URL: postgres://symbols_owner:${OWNER_PASSWORD}@db:5432/symbols
    command: [sh, -ec, 'node scripts/migrate.mjs && node scripts/seed.mjs && node scripts/grants.mjs']
    healthcheck: {disable: true}
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *logging
  api:
    image: ${SYMBOLS_IMAGE:?Required}
    pull_policy: never
    environment:
      DATABASE_URL: postgres://symbols_app:${APP_PASSWORD}@db:5432/symbols
      PG_POOL_MAX: 4
      TRUST_PROXY: 172.30.51.3
      WEB_ORIGIN: https://symbols-staging.votarumshee.com
      METRICS_TOKEN: ${METRICS_TOKEN:?Required}
    volumes: [/var/lib/symbols-staging/avatars:/app/public/avatars]
    networks:
      database: {}
      frontend: {ipv4_address: 172.30.51.2, aliases: [symbols-staging-api]}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging: *logging
volumes:
  pgdata: {name: symbols_staging_pgdata}
networks:
  database:
    name: symbols_staging_database
    internal: true
    ipam:
      config: [{subnet: 172.30.52.0/24}]
  frontend:
    name: symbols_staging_frontend
    ipam:
      config: [{subnet: 172.30.51.0/24}]
